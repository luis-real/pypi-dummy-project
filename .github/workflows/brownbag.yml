name: Environments brownbag

on:
  push:
  pull_request: 
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: self-hosted
    steps:
      - name: Print github context
        run: echo "${{ toJSON(github) }}" 1>/dev/null
  feature:
    environment: development
    runs-on: self-hosted
    steps:
      - name: First task
        run: echo first task executed
      - name: Second task
        run: echo second task executed
  launching:
    environment: production
    needs: feature
    runs-on: self-hosted
    steps:
      - name: Preparing for launch on prod
        run: echo launch starting...
      - name: Launching
        run: echo launch completed
    
      
