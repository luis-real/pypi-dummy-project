name: CI
on: 
  push: 
    branches: 
      - 'main'
  pull_request:
  release:
    types:
      - published      

permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cleanup residual files
        run: rm -fr dist/*
      - name: Build wheel
        run: python -m build --wheel --verbose
  publish:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Download the packages to publish
        run: echo downloading packages...
      - name: Publish package distributions to TestPyPI
        if: github.event_name == 'release'      
        run: echo Packages released
