name: Print Contexts
on: 
  pull_request:
  push:
  release:
    types:
      - published      
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base-context:
    runs-on: self-hosted 
    steps:
      - name: Print github context
        run: echo '${{ toJSON(github) }}' 1>/dev/null
  extra-job:
    runs-on: self-hosted
    needs: base-context
    if: github.event_name == 'release'
    environment:
      name: releasing
      deployment: false      
    steps:
      - name: Do some tasks
        run: echo "Tasks executed"
  
